services:
  postgres:
    image: postgres:17-alpine
    container_name: teamspace-postgres

    environment:
      POSTGRES_USER: teamspace
      POSTGRES_PASSWORD: teamspace_password
      POSTGRES_DB: teamspace_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamspace -d teamspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
